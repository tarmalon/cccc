<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #101820;
      color: #f7f7f2;
      font-family: system-ui, sans-serif;
    }
    main { width: min(92vw, 440px); text-align: center; }
    h1 { margin: 0 0 .25rem; font-size: 2.5rem; }
    .score { margin: 0 0 1rem; color: #b9c4bd; font-size: 1.1rem; }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      background: #17232b;
      border: 3px solid #54d17a;
      border-radius: 10px;
      box-shadow: 0 14px 35px #0007;
    }
    .help { margin: .9rem 0; color: #b9c4bd; font-size: .9rem; }
    button {
      border: 0;
      border-radius: 999px;
      padding: .7rem 1.3rem;
      background: #54d17a;
      color: #101820;
      font: bold 1rem inherit;
      cursor: pointer;
    }
    button:hover { background: #72e291; }
  </style>
</head>
<body>
  <main>
    <h1>🐍 Snake</h1>
    <p class="score">Pontszám: <strong id="score">0</strong></p>
    <canvas id="game" width="400" height="400" aria-label="Snake játéktér"></canvas>
    <p class="help">Irányítás: nyílbillentyűk vagy WASD</p>
    <button id="restart" type="button">Új játék</button>
  </main>

  <script>
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.querySelector('#score');
    const size = 20;
    const tiles = canvas.width / size;
    let snake, food, direction, nextDirection, score, timer, gameOver;

    function randomFood() {
      do {
        food = { x: Math.floor(Math.random() * tiles), y: Math.floor(Math.random() * tiles) };
      } while (snake.some(part => part.x === food.x && part.y === food.y));
    }

    function start() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      direction = nextDirection = { x: 1, y: 0 };
      score = 0;
      gameOver = false;
      scoreEl.textContent = score;
      randomFood();
      clearInterval(timer);
      timer = setInterval(tick, 110);
      draw();
    }

    function tick() {
      direction = nextDirection;
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
      const hitWall = head.x < 0 || head.y < 0 || head.x >= tiles || head.y >= tiles;
      const hitSelf = snake.some(part => part.x === head.x && part.y === head.y);
      if (hitWall || hitSelf) {
        gameOver = true;
        clearInterval(timer);
        draw();
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        randomFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.fillStyle = '#17232b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff5d66';
      ctx.beginPath();
      ctx.arc(food.x * size + size / 2, food.y * size + size / 2, size * .35, 0, Math.PI * 2);
      ctx.fill();
      snake.forEach((part, i) => {
        ctx.fillStyle = i ? '#54d17a' : '#8bf0a9';
        ctx.fillRect(part.x * size + 1, part.y * size + 1, size - 2, size - 2);
      });
      if (gameOver) {
        ctx.fillStyle = '#101820dd';
        ctx.fillRect(0, 160, canvas.width, 80);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 28px system-ui';
        ctx.fillText('Vége a játéknak!', 200, 210);
      }
    }

    const keys = {
      ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 },
      ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }
    };
    addEventListener('keydown', event => {
      const wanted = keys[event.key];
      if (!wanted) return;
      event.preventDefault();
      if (wanted.x !== -direction.x || wanted.y !== -direction.y) nextDirection = wanted;
    });
    document.querySelector('#restart').addEventListener('click', start);
    start();
  </script>
</body>
</html>
